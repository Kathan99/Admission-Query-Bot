# render.yaml
# Render Blueprint for Educational Chatbot

services:
  # Internal Memory Cache (Ephemeral or Persistent depending on plan)
  - type: redis
    name: chatbot-redis
    plan: free # Redis free tier
    ipAllowList: [] # Accessible only securely inside the Render network

  # AI Backend Engine
  - type: web
    name: educational-chatbot-engine
    env: docker
    plan: free # Completely free tier!
    dockerfilePath: ./Dockerfile
    
    # WARNING FOR DEMO: We removed the Paid `disk` mount here. 
    # Render's free tier servers go to sleep after 15 minutes of inactivity.
    # When the server wakes back up, it will have a fresh empty hard drive!
    # Your codebase will still be perfectly fine, but any PDFs you uploaded through admin.html
    # will vanish. You just have to re-upload them for the demo!

    envVars:
      - key: GROQ_API_KEY
        sync: false # User must provide this securely in the Render Dashboard
      
      # Since we don't have a mounted disk, rely entirely on Docker's native ephemeral storage paths
      # - key: STORAGE_DIR 
        
      # Link directly to the internal Redis cluster mapping
      - key: REDIS_HOST
        fromService:
          type: redis
          name: chatbot-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: chatbot-redis
          property: port
