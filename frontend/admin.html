<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Ingestion Admin</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h2 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #34495e; }
        input[type="file"] { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        .drop-zone { border: 2px dashed #cbd5e0; padding: 2rem; text-align: center; border-radius: 6px; background: #f8fafc; cursor: pointer; transition: background 0.2s; }
        .drop-zone:hover, .drop-zone.dragover { background: #e2e8f0; border-color: #94a3b8; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .status { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; }
        .status.success { background: #dcfce7; color: #166534; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Document</h2>
    <p style="color: #64748b; font-size: 0.9em; margin-bottom: 1.5rem;">Upload a PDF. It will be saved into the server's <code>data/</code> folder and processed in the background.</p>

    <div class="form-group">
        <label>Upload PDF Document</label>
        <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            Drag & Drop a PDF here<br>
            <span style="font-size: 0.8em; color: #64748b;">or click to browse</span>
        </div>
        <div id="fileName" style="margin-top: 0.5rem; font-size: 0.9em; color: #3b82f6; font-weight: 500;"></div>
    </div>

    <button id="uploadBtn">Upload & Process</button>

    <div id="statusMessage" class="status"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileNameDisplay = document.getElementById('fileName');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMessage = document.getElementById('statusMessage');

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            fileNameDisplay.textContent = "Selected: " + e.target.files[0].name;
            statusMessage.style.display = "none";
        }
    });

    ['dragover', 'dragenter'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false)
    });
    ['dragleave', 'dragend', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false)
    });

    dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            fileNameDisplay.textContent = "Selected: " + e.dataTransfer.files[0].name;
            statusMessage.style.display = "none";
        }
    });

    uploadBtn.addEventListener('click', async () => {
        if (!fileInput.files.length) {
            alert("Please select a file first!");
            return;
        }

        const file = fileInput.files[0];

        const formData = new FormData();
        formData.append('file', file);

        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Uploading...';
        statusMessage.className = 'status';

        try {
            const response = await fetch('/api/admin/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (response.ok) {
                statusMessage.textContent = "Success! " + (data.message || 'Queued for ingestion.');
                statusMessage.className = 'status success';
                fileInput.value = '';
                fileNameDisplay.textContent = '';
            } else {
                throw new Error(data.detail || 'Upload failed');
            }
        } catch (error) {
            statusMessage.textContent = "Error: " + error.message;
            statusMessage.className = 'status error';
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Upload & Process';
        }
    });
</script>

</body>
</html>
